name: Deploy with CDK (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: production

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install root dependencies
        run: npm ci

      - name: Build API
        working-directory: apps/api
        run: |
          npm ci
          npm run build

      - name: Build Worker
        working-directory: apps/worker
        run: |
          npm ci
          npm run build

      - name: Build Next.js SSR
        working-directory: apps/web-nextjs
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          npm ci
          npm run build:lambda

      - name: Install CDK dependencies
        working-directory: infra/cdk
        run: |
          npm ci
          npm install -g aws-cdk

      - name: Build CDK
        working-directory: infra/cdk
        run: npm run build

      - name: CDK Synth
        working-directory: infra/cdk
        run: |
          cdk synth --all

      - name: CDK Deploy
        working-directory: infra/cdk
        run: |
          ENVIRONMENT=${{ env.ENVIRONMENT }} cdk deploy --all --require-approval never

      - name: Get Outputs
        id: outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name tag-relay-api-${{ env.ENVIRONMENT }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiUrl`].OutputValue' \
            --output text)

          WEB_URL=$(aws cloudformation describe-stacks \
            --stack-name tag-relay-web-${{ env.ENVIRONMENT }} \
            --query 'Stacks[0].Outputs[?OutputKey==`WebUrl`].OutputValue' \
            --output text)

          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "web_url=$WEB_URL" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "### Deployment Successful! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** ${{ steps.outputs.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Web URL:** ${{ steps.outputs.outputs.web_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
