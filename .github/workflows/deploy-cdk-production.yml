name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: eu-north-1            # app region (API, Worker, Web, Database)
  CLOUDFRONT_REGION: us-east-1      # Domain stack (CloudFront, ACM)
  ENVIRONMENT: production

jobs:
  deploy:
    name: Build, test, deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm install

      # Unit-level gate before we touch prod. E2E suites that talk to
      # LocalStack or real GTM are out of scope for CI — run locally before
      # merging. The worker tests cover the migration engine; the API smoke
      # and integration tests exercise the Fastify routes in-process.
      - name: Run worker unit tests
        working-directory: apps/worker
        run: npx vitest run

      - name: Run API smoke + integration tests
        working-directory: apps/api
        run: npx vitest run src/smoke.test.ts src/integration.test.ts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Delegate to the single source of truth for production deploys so CI
      # behaves identically to `AWS_PROFILE=tagrelay-prod bash ./scripts/deploy-production.sh`
      # on a laptop. The script detects CI env-var credentials automatically
      # and skips the shared-credentials profile in that case. It exits
      # non-zero on any stack failure — CloudFormation rolls back the
      # individual stack automatically.
      - name: Deploy via deploy-production.sh
        run: bash ./scripts/deploy-production.sh

      # Smoke-check the live endpoints. If these fail the workflow fails loud
      # and the deploy is left in place for manual investigation — we don't
      # auto-rollback because mixing cdk deploy with raw CloudFormation reverts
      # causes drift and complicates the next deploy.
      - name: Smoke check prod URLs
        run: |
          set -eux

          echo "Checking API health..."
          for i in 1 2 3 4 5; do
            body="$(curl -sS --fail --max-time 10 https://api.ovalt.org/health)" && break
            echo "attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "$body" | grep -q '"ok":true' || {
            echo "::error::API health check failed: $body"
            exit 1
          }

          echo "Checking web..."
          web_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://ovalt.org/)"
          if [ "$web_status" != "200" ]; then
            echo "::error::Web returned HTTP $web_status (expected 200)"
            exit 1
          fi

          echo "Checking admin endpoint is reachable (expect 401 unauthenticated)..."
          admin_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://api.ovalt.org/admin/metrics/summary)"
          if [ "$admin_status" != "401" ]; then
            echo "::error::Admin endpoint returned HTTP $admin_status (expected 401 without auth)"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Production deploy: ${{ job.status }}"
            echo ""
            echo "- **Environment:** ${{ env.ENVIRONMENT }}"
            echo "- **Region:** ${{ env.AWS_REGION }} (app), ${{ env.CLOUDFRONT_REGION }} (CDN)"
            echo "- **Commit:** ${{ github.sha }}"
            echo ""
            echo "### URLs"
            echo "- Website: https://ovalt.org"
            echo "- API: https://api.ovalt.org"
            echo "- Admin: https://ovalt.org/admin"
          } >> "$GITHUB_STEP_SUMMARY"
